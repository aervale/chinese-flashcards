<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Flashcards</title>
<style>
:root{--bg:#f6f7fb;--panel:#ffffff;--panel2:#eef1f7;--line:#e3e8f0;--text:#23262f;--muted:#646b7a;
--accent:#4255ff;--accent2:#c77f10;--green:#23a06b;--red:#e8503a;--blue:#4d8af0;--purple:#8a52d6;--yellow:#ffcd1f;--shadow:0 4px 18px rgba(20,30,60,.08);}
body.dark{--bg:#0f1115;--panel:#1a1d24;--panel2:#222631;--line:#2d323e;--text:#e8eaed;--muted:#9aa3b2;
--accent:#5b6cff;--accent2:#f0a830;--green:#3ecf8e;--red:#e8503a;--blue:#4d8af0;--purple:#a574f0;--yellow:#ffcd1f;--shadow:0 6px 24px rgba(0,0,0,.35);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
header{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel)}
header h1{font-size:19px;font-weight:800;letter-spacing:.2px}
header h1 .zh{color:var(--accent);margin-right:8px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--panel2);padding:4px;border-radius:10px}
.tab{padding:8px 18px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:700;font-size:14px;border:none;background:none}
.tab.active{background:var(--accent);color:#fff}
.gear{background:var(--panel2);border:1px solid var(--line);color:var(--muted);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:17px}
.gear:hover{color:var(--text)}
main{max-width:1000px;margin:0 auto;padding:22px}
.hidden{display:none!important}
/* inline stat bar */
.statbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px;margin-bottom:22px;box-shadow:var(--shadow)}
.si{padding:2px 18px;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;border-right:1px solid var(--line)}
.si:last-child{border-right:none}
.si b{font-size:19px;font-weight:800;margin-right:6px}
.si.daily b{color:var(--accent)}.si.bidaily b{color:var(--accent2)}.si.weekly b{color:var(--blue)}.si.retired b{color:var(--green)}.si.archive b{color:var(--purple)}.si.acc b{color:var(--text)}
.controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.controls input,.controls select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-size:14px;outline:none}
.controls input{flex:1;min-width:180px}.controls input:focus,.controls select:focus{border-color:var(--accent)}
.add-btn{background:var(--green);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
th{text-align:left;padding:11px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--text)}
td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
tr:last-child td{border-bottom:none}
td.han{font-size:22px;font-weight:600;width:54px}
td.py{color:var(--accent2);white-space:nowrap}
td.def{font-size:13px;color:var(--muted);max-width:360px}
td.acc{font-weight:700;white-space:nowrap}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-daily{background:rgba(66,85,255,.14);color:var(--accent)}.b-bidaily{background:rgba(240,168,48,.18);color:var(--accent2)}
.b-weekly{background:rgba(77,138,240,.16);color:var(--blue)}.b-retired{background:rgba(35,160,107,.16);color:var(--green)}
.b-archive{background:rgba(138,82,214,.16);color:var(--purple)}
.count{font-size:13px;color:var(--muted);margin-bottom:10px}
.study-bar{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--panel2);border-radius:22px;padding:3px}
.seg button{border:none;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:7px 16px;border-radius:18px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.dirwrap{text-align:center;margin-bottom:16px}
.chip{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;font-size:12px;font-weight:700}
.chip.on{border-color:var(--accent);color:#fff;background:var(--accent)}
.addnext{text-align:center;margin-bottom:16px}
.addnext button{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:22px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:var(--shadow)}
.addnext button:hover{filter:brightness(1.06)}.addnext button:active{transform:scale(.97)}
.builder{max-width:600px;margin:0 auto 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.builder .study-bar{margin-bottom:12px}
.chiplabel{align-self:center;font-size:12px;color:var(--muted);font-weight:700;margin-right:2px}
.setbar{display:flex;flex-direction:column;gap:9px;align-items:center}
.setrow1{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.setq{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.setq input{width:58px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px;font-size:14px;font-weight:700;text-align:center;outline:none}
.setq input:focus{border-color:var(--accent)}
.setbtn{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:9px 22px;font-size:14px;font-weight:700;cursor:pointer}
.setbtn:hover{filter:brightness(1.06)}.setbtn:active{transform:scale(.97)}
.setlink{background:none;border:none;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.setlink.reset{color:var(--red)}
.setstatus{font-size:12px;color:var(--muted)}.setstatus b{color:var(--text)}
.study-wrap{max-width:640px;margin:0 auto;text-align:center}
.progress{height:6px;background:var(--panel2);border-radius:3px;margin-bottom:16px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .3s}
/* Quizlet-style card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:40px 28px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;box-shadow:var(--shadow);transition:transform .12s}
.card:active{transform:scale(.997)}
.card .han{font-size:88px;font-weight:600;line-height:1.1}
.card .py{font-size:27px;color:var(--accent2);margin-top:12px;display:flex;align-items:center;gap:10px}
.card .def{font-size:16px;color:var(--muted);margin-top:10px;max-width:480px}
.card .prompt{font-size:24px;color:var(--text);max-width:500px;font-weight:500}
.card .sent{margin-top:18px;font-size:19px;color:var(--text);background:var(--panel2);padding:10px 16px;border-radius:12px;max-width:500px;display:flex;align-items:center;gap:8px;justify-content:center}
.card .sent em{color:var(--accent2);font-style:normal;font-weight:700}
.card .hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted);opacity:.6}
.card .meta{position:absolute;top:14px;right:16px;display:flex;gap:6px;align-items:center}
.card .wstat{position:absolute;top:14px;left:16px;font-size:12px;color:var(--muted)}
.spk{background:var(--panel2);border:1px solid var(--line);color:var(--accent2);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:15px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.spk.sm{width:26px;height:26px;font-size:13px}.spk:hover{background:var(--accent2);color:#fff}.spk:active{transform:scale(.92)}
/* control bar under card (Quizlet-like) */
.ctrlbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}
.cbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:50%;width:50px;height:50px;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.cbtn:hover{border-color:var(--accent)}
.cbtn.big{width:62px;height:62px;font-size:24px}
.cbtn.miss{border-color:var(--red);color:var(--red)}.cbtn.miss:hover{background:var(--red);color:#fff}
.cbtn.got{border-color:var(--green);color:var(--green)}.cbtn.got:hover{background:var(--green);color:#fff}
.cbtn.skip{color:var(--muted)}
.clabel{font-size:11px;color:var(--muted);margin-top:5px;font-weight:600}
.cgroup{display:flex;flex-direction:column;align-items:center}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.foot{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:28px;flex-wrap:wrap}
.link{color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(470px,96vw);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal h3{margin-bottom:14px;font-size:18px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.modal input,.modal select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px;border-radius:9px;font-size:15px;outline:none}
.modal-row{display:flex;gap:10px}.modal-row>div{flex:1}
.modal-btns{display:flex;gap:10px;margin-top:18px}
.modal-btns button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:15px}
.save-b{background:var(--green);color:#fff}.cancel-b{background:var(--panel2);color:var(--muted)}
.del-b{background:var(--red);color:#fff}
.warn{background:rgba(232,80,58,.12);border:1px solid var(--red);color:var(--red);padding:10px 12px;border-radius:10px;font-size:13px;margin-top:14px;font-weight:600}
.wd{font-size:14px;color:var(--muted);line-height:1.9}.wd b{color:var(--text)}
.wd .sent{font-size:18px;color:var(--text);margin-top:8px;display:flex;align-items:center;gap:8px}.wd .sent em{color:var(--accent2);font-style:normal;font-weight:700}
.movebar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.movebar button{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.setrow:last-of-type{border-bottom:none}.setrow .t{font-size:14px;font-weight:600}.setrow .s{font-size:12px;color:var(--muted)}
.minib{font-size:13px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-weight:600;white-space:nowrap}
.minib.danger{border-color:var(--red);color:var(--red)}
.switch{position:relative;width:46px;height:26px;flex:0 0 auto}.switch input{display:none}
.slider{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:20px;cursor:pointer;transition:.2s}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--accent);border-color:var(--accent)}.switch input:checked+.slider:before{transform:translateX(20px);background:#fff}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
/* RPG character panel */
.layout{display:flex;max-width:1260px;margin:0 auto;align-items:flex-start;gap:8px}
#sidebar{width:256px;flex:0 0 256px;padding:20px 14px}
main{flex:1;max-width:1000px;margin:0}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:var(--shadow);text-align:center}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--panel2);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:46px;margin:0 auto 8px;cursor:pointer;transition:transform .15s;user-select:none}
.avatar:hover{transform:scale(1.05)}
.avatar.happy{animation:bounce .5s}.avatar.sad{animation:shake .5s;filter:grayscale(.6)}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.25) translateY(-6px)}60%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-6deg)}40%{transform:translateX(7px) rotate(6deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.uname{font-size:16px;font-weight:800;margin-top:2px;display:flex;align-items:center;justify-content:center;gap:5px}
.utitle{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.lvrow{display:flex;align-items:center;gap:8px;margin:10px 0 4px}
.lvbadge{background:var(--accent);color:#fff;font-weight:800;font-size:12px;padding:3px 9px;border-radius:8px;white-space:nowrap}
.xpbar{flex:1;height:12px;background:var(--panel2);border-radius:7px;overflow:hidden;position:relative;border:1px solid var(--line)}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));transition:width .5s}
.xptxt{font-size:10px;color:var(--muted);text-align:right;margin-top:2px}
.mood{min-height:20px;font-size:13px;font-weight:700;margin-top:8px;height:20px}
.mood.good{color:var(--green)}.mood.bad{color:var(--red)}
.masterbox{display:flex;gap:8px;margin:12px 0}
.mbox{flex:1;background:var(--panel2);border-radius:10px;padding:8px 6px}
.mbox b{display:block;font-size:18px;color:var(--accent)}.mbox span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.attrs{margin-top:14px;text-align:left}
.attrs h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;text-align:center}
.attr{margin-bottom:9px}
.attr .lab{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:3px}
.attr .lab .v{color:var(--accent)}
.attr .ab{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.attr .ab>div{height:100%;border-radius:4px;transition:width .5s;background:var(--accent)}
.profrow{display:flex;gap:6px;margin-bottom:12px}
.profrow select{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px;font-size:13px;font-weight:700;outline:none}
.profbtn{width:36px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:9px;cursor:pointer;font-size:15px}
.profbtn:hover{color:var(--text);border-color:var(--accent)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.statcell{background:var(--panel2);border-radius:10px;padding:10px}
.statcell b{display:block;font-size:20px;color:var(--accent)}.statcell span{font-size:11px;color:var(--muted)}
.attr .desc{font-size:10px;color:var(--muted);margin-top:2px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.fxpop{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-size:30px;font-weight:800;animation:floatUp 1s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.fxpop.good{color:var(--green)}.fxpop.bad{color:var(--red)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,-4px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.avpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.avpick button{font-size:24px;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.avpick button.on{border-color:var(--accent);background:var(--panel)}
.cocols{display:flex;gap:8px;margin-top:6px}
.cocols button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.cocols button.on{border-color:var(--text)}
@media(max-width:900px){.layout{flex-direction:column}#sidebar{width:auto;flex:auto;padding:16px}}
</style></head><body>
<header><h1>Chinese Flashcards</h1>
<div class="tabs"><button class="tab active" data-view="study">Study</button><button class="tab" data-view="browse">Browse</button></div>
<button class="gear" id="gear" title="Settings">⚙</button></header>
<div class="layout">
<aside id="sidebar"></aside>
<main>
<div class="statbar" id="stats"></div>
<section id="study">
  <div class="dirwrap"><div class="seg" id="dirSeg">
    <button data-dir="char" class="on">汉字 → Meaning</button><button data-dir="term">Meaning → 汉字</button></div></div>
  <div class="builder">
    <div class="study-bar" id="bucketChips"></div>
    <div class="setbar" id="setBar"></div>
  </div>
  <div class="addnext"><button id="addNext">＋ Add next easiest word to Daily</button></div>
  <div class="study-wrap"><div class="progress"><div id="progBar"></div></div><div id="cardHost"></div></div>
</section>
<section id="browse" class="hidden">
  <div class="controls">
    <input id="search" placeholder="Search character, pinyin, or meaning…">
    <select id="fBucket"><option value="">All buckets</option><option>Daily</option><option>Bidaily</option><option>Weekly</option><option>Retired</option><option>Archive</option></select>
    <select id="fHsk"><option value="">All HSK</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
    <button class="add-btn" id="addBtn">+ Add word</button>
  </div>
  <div class="count" id="browseCount"></div>
  <table><thead><tr>
    <th data-sort="hanzi">Hanzi</th><th data-sort="pinyin">Pinyin</th><th data-sort="def">Meaning</th>
    <th data-sort="bucket">Bucket</th><th data-sort="hsk">HSK</th><th data-sort="freq">Freq</th>
    <th data-sort="correct">✓</th><th data-sort="wrong">✕</th><th data-sort="acc">Acc</th>
  </tr></thead><tbody id="tbody"></tbody></table>
</section>
<div class="foot"><span class="link" id="saveProg">💾 Save progress to file</span><span class="link" id="resetAll">Reset all progress</span></div>
</main>
</div>

    return true;});
  list.sort((a,b)=>{let x,y;
    if(sortKey==="acc"){x=acc(a)??-1;y=acc(b)??-1;}
    else{x=a[sortKey]??"";y=b[sortKey]??"";if(["hsk","freq","wrong","correct"].includes(sortKey)){x=+x||0;y=+y||0;}}

function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
function studySet(){return (game&&Array.isArray(game.set))?game.set:[];}
function buildQueue(){
  // Study only the words in the saved practice set (a chosen subsection).
  const setHas=new Set(studySet());
  queue=words.filter(w=>setHas.has(w.hanzi));
  queue.sort((a,b)=>(b.wrong-a.wrong)+(Math.floor(rnd()*6)-3));
  // Compound cards — only when every component character is in the current practice set.
  if(settings.quizCompounds){
    const eligible=COMPOUNDS.filter(cp=>cp.c.every(ch=>setHas.has(ch)));
    const n=Math.min(eligible.length,Math.max(2,Math.round(queue.length*0.15)));
    const used=new Set();
    for(let i=0;i<n&&eligible.length;i++){
      let idx=Math.floor(rnd()*eligible.length),tries=0;
      while(used.has(idx)&&tries<8){idx=Math.floor(rnd()*eligible.length);tries++;}
      used.add(idx);const cp=eligible[idx];
      queue.splice(Math.floor(rnd()*(queue.length+1)),0,{_cmp:true,hanzi:cp.w,pinyin:cp.p,def:cp.d,parts:cp.c});
    }
  }
  startCount=queue.length;
}

  else{pool=words.filter(w=>activeBuckets.has(w.bucket));
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t;}}
  if(!pool.length){toast(weak?"No studied words yet — study some first":"Select at least one bucket that has words");return;}

function applyAnswer(w,ok){
  const was=w.bucket;
  if(ok){w.correct++;w.streak=(w.streak||0)+1;if(w.streak>=settings.promoteThreshold){w.bucket=NEXT[w.bucket];w.streak=0;}}

  else{if(applyAnswer(c,ok))mastered++;if(!ok)queue.push(c);}
  const gained=(ok?(c._cmp?15:10):2)+mastered*50;
  game.xp+=gained;game.reviews=(game.reviews||0)+1;game.mastersEarned=(game.mastersEarned||0)+mastered;
  if(ok){game.sessionStreak=(game.sessionStreak||0)+1;if(game.sessionStreak>(game.bestStreak||0))game.bestStreak=game.sessionStreak;}
  else game.sessionStreak=0;

function addNextEasiest(){
  const pool=words.filter(w=>w.bucket==="Archive"&&!skipPool.has(w.hanzi));
  if(!pool.length){toast(skipPool.size?"No more words to add (all remaining were skipped)":"No words left in Archive");return;}
  pool.sort((a,b)=>(a.freq??1e9)-(b.freq??1e9));
  const w=pool[0];w.bucket="Daily";w.streak=0;
  if(game&&Array.isArray(game.set)&&!game.set.includes(w.hanzi)){game.set.push(w.hanzi);saveGame();}
  save();renderStats();renderChips();buildQueue();if(!current)nextCard();
  renderBrowse();openIntro(w);
}

// ---------- progress file ----------
function progressCSV(){const e=s=>`"${String(s).replace(/"/g,'""')}"`;
  const rows=[["hanzi","pinyin","bucket","hsk","freq","correct","incorrect","total","accuracy"].map(e).join(",")];
  words.forEach(w=>{const t=w.correct+w.wrong;rows.push([w.hanzi,w.pinyin,w.bucket,w.hsk||"",w.freq||"",w.correct,w.wrong,t,t?Math.round(100*w.correct/t):""].map(e).join(","));});
  return rows.join("\n");}
let fileHandles={};
function profName(id){return (profiles.find(p=>p.id===(id||activeId))||{}).name||"profile";}
function todayISO(){return new Date().toISOString().slice(0,10);}
function csvName(id){return "progress_"+profName(id).replace(/[^a-z0-9]+/gi,"_")+"_"+todayISO()+".csv";}
function downloadFile(name,content){const b=new Blob([content],{type:"text/csv"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
async function saveProgress(){const csv=progressCSV();const fn=csvName();
  if(window.showSaveFilePicker){try{if(!fileHandles[activeId])fileHandles[activeId]=await window.showSaveFilePicker({suggestedName:fn,types:[{description:"CSV",accept:{"text/csv":[".csv"]}}]});
    const ws=await fileHandles[activeId].createWritable();await ws.write(csv);await ws.close();toast("Saved "+profName());return;}catch(e){if(e.name==="AbortError")return;}}
  downloadFile(fn,csv);toast(fn+" downloaded");}
async function autosave(){const h=fileHandles[activeId];if(h){try{const ws=await h.createWritable();await ws.write(progressCSV());await ws.close();}catch(e){}}}
function loadProgress(){const inp=document.createElement("input");inp.type="file";inp.accept=".csv";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{applyCSV(r.result);save();renderStats();renderChips();buildQueue();nextCard();renderBrowse();closeModal();toast("Progress loaded");}catch(e){alert("Could not read file");}};r.readAsText(f);};inp.click();}
function applyCSV(text){const lines=text.split(/\r?\n/).filter(l=>l.trim());const hdr=parseCSVLine(lines[0]).map(h=>h.toLowerCase());
  const ci=n=>hdr.indexOf(n);const map={};words.forEach(w=>map[w.hanzi]=w);
  for(let i=1;i<lines.length;i++){const c=parseCSVLine(lines[i]);const w=map[c[ci("hanzi")]];if(!w)continue;
    w.correct=+c[ci("correct")]||0;w.wrong=+c[ci("incorrect")]||0;const b=c[ci("bucket")];if(BUCKETS.includes(b))w.bucket=b;}}
function parseCSVLine(l){const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];
  if(q){if(ch=='"'){if(l[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
  else{if(ch=='"')q=true;else if(ch==',') {out.push(cur);cur="";}else cur+=ch;}}out.push(cur);return out;}

const AVATARS=["🐼","🦊","🐯","🐲","🦉","🐧","🐵","🦁","🐨","🦄","🐸","🐱","🧙","🥷","👩‍🎓","🧑‍🚀","🐰","🐢"];
const COLORS=["#4255ff","#e8503a","#23a06b","#a855f7","#0ea5e9","#f59e0b","#ec4899","#14b8a6"];
const TITLES=["Beginner","Novice","Apprentice","Student","Scholar","Adept","Linguist","Sage","Master","Grandmaster","Polyglot","Legend"];
let game=JSON.parse(localStorage.getItem(gkey())||"null");
function saveGame(){localStorage.setItem(gkey(),JSON.stringify(game));}
function dayNum(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
function initGame(){
  if(!game){const retired=words.filter(w=>w.bucket==="Retired").length;
    game={name:"Scholar",avatar:"🐼",accent:COLORS[0],xp:retired*20,mastersEarned:retired,reviews:0,bestStreak:0,sessionStreak:0,dayStreak:1,bestDayStreak:1,totalDays:1,lastDay:dayNum(),set:[]};}
  const hadMasters=game.mastersEarned!=null;
  game=Object.assign({name:"Scholar",avatar:"🐼",accent:COLORS[0],xp:0,mastersEarned:0,reviews:0,bestStreak:0,sessionStreak:0,dayStreak:1,bestDayStreak:1,totalDays:1,lastDay:dayNum(),set:[]},game);
  if(!hadMasters)game.mastersEarned=masteredCount();
  const t=dayNum();
  if(game.lastDay!==t){const diff=t-game.lastDay;game.dayStreak=diff===1?(game.dayStreak||0)+1:1;game.totalDays=(game.totalDays||0)+1;game.lastDay=t;}
  game.bestDayStreak=Math.max(game.bestDayStreak||1,game.dayStreak||1);
  saveGame();
}
function applyAccent(){if(game&&game.accent)document.documentElement.style.setProperty("--accent",game.accent);}
function levelInfo(xp){let lvl=1,need=100,rem=xp;while(rem>=need){rem-=need;lvl++;need=100*lvl;}return{level:lvl,into:rem,need:need,pct:Math.round(100*rem/need)};}
function masteredCount(){return words.filter(w=>w.bucket==="Retired").length;}
// Each attribute levels up from its own activity; every level costs more (base*(level+1)).
function attrLevel(exp,base){let lvl=0,need=base,rem=exp;while(rem>=need){rem-=need;lvl++;need=base*(lvl+1);}return{level:lvl,into:Math.round(rem),need:need,pct:Math.round(100*rem/need)};}
function attrList(){
  let cor=0,attempted=0;words.forEach(w=>{cor+=w.correct;if(w.correct+w.wrong>0)attempted++;});
  const defs=[
    {k:"Power",i:"💪",exp:cor,base:8,d:"correct answers"},
    {k:"Consistency",i:"🔥",exp:(game.totalDays-1)+(game.bestDayStreak||1),base:3,d:"days practiced"},
    {k:"Memory",i:"🧠",exp:(game.mastersEarned||0),base:5,d:"masteries earned"},
    {k:"Wisdom",i:"📚",exp:attempted,base:10,d:"words practiced"},
    {k:"Focus",i:"⚡",exp:(game.bestStreak||0),base:3,d:"best streak"},
    {k:"Diligence",i:"🎯",exp:(game.reviews||0),base:20,d:"total reviews"},
  ];
  return defs.map(a=>{const L=attrLevel(a.exp,a.base);return Object.assign({},a,{lvl:L.level,pct:L.pct,into:L.into,need:L.need});});
}
function attrTotal(){return attrList().reduce((s,a)=>s+a.lvl,0);}

        <div class="ab"><div style="width:${a.pct}%"></div></div><div class="desc">${a.into}/${a.need} ${a.d} to next</div></div>`).join("")}

  document.getElementById("avatarBtn").onclick=openCharacter;
  document.getElementById("editChar").onclick=openCharacter;
  document.getElementById("profSel").onchange=e=>switchProfile(e.target.value);
  document.getElementById("profNew").onclick=createProfile;
  document.getElementById("profMng").onclick=openProfiles;
}
function switchProfile(id){if(id===activeId)return;activeId=id;localStorage.setItem(AKEY,id);
  words=loadWords();game=JSON.parse(localStorage.getItem(gkey())||"null");initGame();applyAccent();
  skipPool=new Set();activeBuckets=new Set(["Daily","Bidaily"]);
  renderStats();renderChips();buildQueue();nextCard();renderBrowse();toast("Switched to "+(profiles.find(p=>p.id===id)||{}).name);}
function blankWords(){return SEED.map(x=>({...x,bucket:"Archive",correct:0,wrong:0,streak:0}));}
function createProfile(){const name=(prompt("New profile name:","Player "+(profiles.length+1))||"").trim();if(!name)return;
  const id=pid();profiles.push({id,name});localStorage.setItem(PKEY,JSON.stringify(profiles));
  // brand-new profile = clean slate: every word in Archive, level 1, all attributes 0
  const blank=blankWords();localStorage.setItem(wkey(id),JSON.stringify(blank));
  localStorage.setItem(gkey(id),JSON.stringify({name:name,avatar:"🐼",accent:COLORS[0],xp:0,mastersEarned:0,reviews:0,bestStreak:0,sessionStreak:0,dayStreak:1,bestDayStreak:1,totalDays:1,lastDay:dayNum(),set:[]}));
  // give the new profile its own starter save file
  const hdr=["hanzi","pinyin","bucket","hsk","freq","correct","incorrect","total","accuracy"];
  const csv=[hdr.join(",")].concat(blank.map(w=>[w.hanzi,w.pinyin,w.bucket,w.hsk||"",w.freq||"",0,0,0,""].join(","))).join("\n");
  downloadFile(csvName(id),csv);
  switchProfile(id);toast("Created "+name+" — saved "+csvName(id));}
function openProfiles(){
  document.getElementById("modalHost").innerHTML=`<div class="overlay" id="ov"><div class="modal">
    <h3>Profiles</h3>
    <div class="wd">Each profile keeps its own words, progress, and character.</div>
    <div id="profList">${profiles.map(p=>`<div class="setrow"><div><div class="t">${esc(p.name)}${p.id===activeId?' <span style="color:var(--accent)">(active)</span>':''}</div></div>
      <div style="display:flex;gap:6px"><button class="minib" data-ren="${p.id}">Rename</button><button class="minib danger" data-del="${p.id}" ${profiles.length<2?"disabled":""}>Delete</button></div></div>`).join("")}</div>
    <div class="modal-btns"><button class="minib" id="p_new" style="flex:1">＋ New profile</button><button class="save-b" id="p_close">Done</button></div></div></div>`;
  document.getElementById("ov").onclick=e=>{if(e.target.id==="ov")closeModal();};
  document.getElementById("p_close").onclick=closeModal;
  document.getElementById("p_new").onclick=()=>{closeModal();createProfile();};
  document.querySelectorAll("[data-ren]").forEach(b=>b.onclick=()=>{const p=profiles.find(x=>x.id===b.dataset.ren);const n=(prompt("Rename profile:",p.name)||"").trim();if(n){p.name=n;localStorage.setItem(PKEY,JSON.stringify(profiles));renderCharacter();openProfiles();}});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(profiles.length<2)return;const p=profiles.find(x=>x.id===b.dataset.del);
    if(confirm(`Delete profile “${p.name}” and its progress? This cannot be undone.`)){
      localStorage.removeItem(wkey(p.id));localStorage.removeItem(gkey(p.id));
      profiles=profiles.filter(x=>x.id!==p.id);localStorage.setItem(PKEY,JSON.stringify(profiles));
      if(activeId===p.id){closeModal();switchProfile(profiles[0].id);}else{renderCharacter();openProfiles();}}});
}
function openStats(){
  const li=levelInfo(game.xp);let cor=0,att=0,attempted=0;words.forEach(w=>{cor+=w.correct;att+=w.correct+w.wrong;if(w.correct+w.wrong>0)attempted++;});
  const accv=att?Math.round(100*cor/att):0;const title=TITLES[Math.min(TITLES.length-1,Math.floor((li.level-1)/3))];
  const cells=[["Level",li.level],["Total XP",game.xp],["Words mastered",masteredCount()],["Vocab breadth",attempted+" / "+words.length],
    ["Accuracy",accv+"%"],["Total reviews",game.reviews||0],["Best streak",game.bestStreak||0],["Days active",game.totalDays||1],
    ["Current day streak",(game.dayStreak||1)+"🔥"],["Best day streak",game.bestDayStreak||1]];
  document.getElementById("modalHost").innerHTML=`<div class="overlay" id="ov"><div class="modal">
    <h3>${esc(game.avatar)} ${esc(game.name)} — Stats</h3>
    <div class="s" style="color:var(--muted);font-size:13px;margin-top:-8px">Lv.${li.level} ${title} · ${li.into}/${li.need} XP to next</div>
    <div class="statgrid">${cells.map(c=>`<div class="statcell"><b>${c[1]}</b><span>${c[0]}</span></div>`).join("")}</div>
    <h4 style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:6px 0 8px">Attributes (total Lv ${attrTotal()})</h4>
    ${attrList().map(a=>`<div class="attr"><div class="lab"><span>${a.i} ${a.k}</span><span class="v">Lv ${a.lvl}</span></div>
      <div class="ab"><div style="width:${a.pct}%"></div></div><div class="desc">${a.into}/${a.need} ${a.d} to next level</div></div>`).join("")}
    <div class="modal-btns"><button class="save-b" id="st_close">Close</button></div></div></div>`;
  document.getElementById("ov").onclick=e=>{if(e.target.id==="ov")closeModal();};
  document.getElementById("st_close").onclick=closeModal;
}
function reactGrade(ok,gained,mastered){
  const av=document.querySelector(".avatar"),mood=document.getElementById("mood");
  if(av){av.classList.remove("happy","sad");void av.offsetWidth;av.classList.add(ok?"happy":"sad");}
  if(mood){const good=["Nice!","Great!","Yes!","Sharp!","Correct!"],bad=["Oops…","Keep going","Not quite","Shake it off"];
    mood.textContent=ok?(mastered?"⭐ Mastered!":good[Math.floor(Math.random()*good.length)]):bad[Math.floor(Math.random()*bad.length)];
    mood.className="mood "+(ok?"good":"bad");clearTimeout(moodTimer);moodTimer=setTimeout(()=>{mood.textContent="";mood.className="mood";},1400);}
  const fx=document.getElementById("fx");const p=document.createElement("div");
  p.className="fxpop "+(ok?"good":"bad");p.textContent=(ok?"+":"")+gained+" XP"+(mastered?" ⭐":"")+(ok?" 😄":" 😢");
  fx.appendChild(p);setTimeout(()=>p.remove(),1000);
}
function openCharacter(){
  document.getElementById("modalHost").innerHTML=`<div class="overlay" id="ov"><div class="modal">
    <h3>Your character</h3>
    <label>Name</label><input id="c_name" maxlength="20" value="${esc(game.name)}">
    <label>Avatar</label><div class="avpick" id="c_av">${AVATARS.map(a=>`<button class="${a===game.avatar?'on':''}" data-a="${a}">${a}</button>`).join("")}</div>
    <label>Theme color</label><div class="cocols" id="c_col">${COLORS.map(c=>`<button class="${c===game.accent?'on':''}" data-c="${c}" style="background:${c}"></button>`).join("")}</div>
    <div class="modal-btns"><button class="cancel-b" id="c_cancel">Cancel</button><button class="save-b" id="c_save">Save</button></div></div></div>`;
  document.getElementById("ov").onclick=e=>{if(e.target.id==="ov")closeModal();};
  let pa=game.avatar,pc=game.accent;
  document.getElementById("c_av").onclick=e=>{const b=e.target.closest("button");if(!b)return;pa=b.dataset.a;document.querySelectorAll("#c_av button").forEach(x=>x.classList.toggle("on",x===b));};
  document.getElementById("c_col").onclick=e=>{const b=e.target.closest("button");if(!b)return;pc=b.dataset.c;document.querySelectorAll("#c_col button").forEach(x=>x.classList.toggle("on",x===b));};
  document.getElementById("c_cancel").onclick=closeModal;
  document.getElementById("c_save").onclick=()=>{game.name=document.getElementById("c_name").value.trim()||"Scholar";game.avatar=pa;game.accent=pc;saveGame();applyAccent();renderCharacter();closeModal();toast("Character saved");};
}
initGame();applyAccent();
renderStats();renderChips();buildQueue();nextCard();
</script></body></html>
